<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>PDF 閱讀器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="home">
  <div class="home-head">
    <div>
      <h1>PDF 閱讀器</h1>
      <p>地盤圖則檢視</p>
    </div>
  </div>
  <button id="homeOpen" class="home-open"><span>＋</span><span><strong>開啟 PDF</strong><small>從手機選擇圖則檔案</small></span></button>
  <div class="home-tabs">
    <button id="homeRecent" class="home-tab active">最近開啟</button>
    <button id="homeFavorites" class="home-tab">收藏</button>
  </div>
  <h2 id="homeTitle">最近開啟</h2>
  <section id="homeList" aria-live="polite"></section>
  <p class="home-share-note">亦可在 WhatsApp 選擇「分享」並開啟 PDF 閱讀器。</p>
</main>

<div id="stage" hidden>
  <canvas id="view"></canvas>
  <div id="drop" class="hint" hidden>放開即開</div>
  <div id="empty" hidden>
    <div class="circle">PDF</div>
    <p>開啟你想放大睇嘅 PDF</p>
    <button id="pick" class="primary">揀檔案</button>
  </div>
  <div id="spinner" hidden></div>
  <div id="badge" hidden></div>
</div>

<header id="top" hidden>
  <button id="backHome" class="ghost" title="返回首頁">‹ 首頁</button>
  <button id="openBtn" class="ghost" title="開啟其他 PDF">開啟</button>
  <span id="pgLabel" class="pg" hidden>1 / 1</span>
  <button id="favoriteBtn" class="ghost" title="收藏" hidden>☆</button>
  <button id="fitBtn" class="ghost" title="符合闊度" hidden>符合</button>
</header>

<nav id="bottom" hidden>
  <button id="prev" class="nav" title="上一頁">‹</button>
  <div id="zoomWrap">
    <button id="zoomOut" class="nav">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" class="nav">+</button>
  </div>
  <button id="next" class="nav" title="下一頁">›</button>
</nav>

<input id="file" type="file" accept="application/pdf,.pdf" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
